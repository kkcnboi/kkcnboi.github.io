Songti SC",serif;font-size:22px;font-weight:500;margin:0 0 4px}.wish h2 span{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12px;color:#32665a;background:#dcebe3;border-radius:99px;padding:3px 9px;vertical-align:middle;margin-left:6px}.hint{color:#777067;font-size:12px;margin:0 0 14px}.wish-add{display:flex;gap:8px;flex-wrap:wrap}.wish-add input{flex:1;min-width:180px;padding:12px 14px;font-size:15px;border:1px solid #ded6ca;border-radius:12px;background:#fff;color:#24211d}.wish-add select{padding:12px 10px;font-size:14px;border:1px solid #ded6ca;border-radius:12px;background:#fff;color:#24211d}.wish-add button{background:#32665a;color:#fff;border:0;border-radius:12px;padding:0 18px;font-size:14px;cursor:pointer;white-space:nowrap}.wish-foot{color:#777067;font-size:12px;margin:12px 0 0}.wish-foot button{background:none;border:0;color:#32665a;text-decoration:underline;cursor:pointer;font-size:12px;padding:0}@media(max-width:620px){.head{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.wish-add input{min-width:100%}}</style></head><body><main class="w"><header class="head"><div><h1>月亨的书架</h1><p class="sub">读过的，准备读的，以及下一本想遇见的书。</p></div><a class="n" href="https://www.notion.so/db54766945a7451aa25573e60ec09ed8">在 Notion 管理</a></header><section class="stats"><div class="s"><b id="sAll">45</b><span>全部藏书</span></div><div class="s"><b id="sRead">30</b><span>已经阅读</span></div><div class="s"><b id="sIng">1</b><span>正在阅读</span></div><div class="s"><b id="sWait">14</b><span>等待阅读</span></div></section><div class="tools"><input id="q" class="q" placeholder="搜索书名或分类…"><nav class="tabs"><button class="tab on" data-f="全部">全部</button><button class="tab" data-f="已读">已读 30</button><button class="tab" data-f="在读">在读 1</button><button class="tab" data-f="未读">未读 14</button><button class="tab" data-f="想买">想买 5</button></nav></div><section id="list" class="grid"></section><section class="wish"><h2>想买的书 <span id="wishCount">5</span></h2><p class="hint">看到想买的、或刚买回来的，随手记一条，别靠脑子记。回车或点按钮都能添加。</p><div class="wish-add"><input id="wishInput" placeholder="书名，可带作者 / 出版社"><select id="wishType"><option value="想买">想买</option><option value="未读">刚买·待读</option></select><button id="wishAdd">记一本</button></div><p class="wish-foot">随手记的内容保存在这台设备的浏览器里，卡片上的 × 可删除 · <button id="wishCopy">复制想买清单</button></p></section><p class="foot">书单更新于 2026 年 11 月 · 数据管理请进入 Notion</p></main><script>
const g={"心理与认知":{"已读":["思考，快与慢","高效能人士的七个习惯","人性的弱点","墨菲定律","别让情绪毁了你的努力","故事思维","认知觉醒"],"未读":["津巴多普通心理学","犯罪心理学","非暴力沟通","当下的力量"]},"商业与投资":{"已读":["原则","别独自用餐","彼得·林奇教你理财","彼得·林奇的成功投资","消费者行为：基于数据的营销决策","穷查理宝典","商业至简","本质","盗火","穿越寒冬","纳瓦尔宝典"],"未读":["企业再造","反脆弱","基业长青","贫穷的本质","金钱心理学"]},"家庭与育儿":{"已读":["好妈妈胜过好老师","不吼不叫培养好孩子","教育孩子要懂的心理学","准爸爸睡前胎教故事","与宝宝对话","西尔斯怀孕百科"]},"文学与人生":{"已读":["你当像鸟飞往你的山","麦田里的守望者","穆斯林的葬礼","我们仨","瓦尔登湖","悉达多"],"在读":["活着"],"未读":["沧浪之水"]},"健康与生活":{"未读":["控糖革命"]},"艺术与摄影":{"未读":["一生的凝视","图解世界名画"]},"行业与专业":{"未读":["锂光 · 刘冠伟 · 清华大学出版社"]},"想买清单":{"想买":["日本经济史","枪炮、病菌与钢铁","美好人生指南 · 一稼","反本能 · 卫蓝","认知驱动 · 周岭"]}};
const WK="bookshelf_notes_v1";
let notes=[];
try{notes=JSON.parse(localStorage.getItem(WK)||"[]")}catch(e){notes=[]}
function save(){try{localStorage.setItem(WK,JSON.stringify(notes))}catch(e){}}
function build(){const B=[];Object.entries(g).forEach(([c,s])=>Object.entries(s).forEach(([t,n])=>n.forEach(x=>B.push({x:x,c:c,t:t}))));notes.forEach(n=>B.push({x:n.x,c:"随手记",t:n.t,local:true,id:n.id}));return B}
let B=build(),f="全部";
const L=document.querySelector("#list"),Q=document.querySelector("#q");
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[m]);
function counts(){const c={"已读":0,"在读":0,"未读":0,"想买":0};B.forEach(b=>{if(c[b.t]!==undefined)c[b.t]++});return c}
function refresh(){const c=counts();document.querySelector("#sAll").textContent=B.filter(b=>b.t!=="想买").length;document.querySelector("#sRead").textContent=c["已读"];document.querySelector("#sIng").textContent=c["在读"];document.querySelector("#sWait").textContent=c["未读"];document.querySelectorAll(".tab").forEach(b=>{const k=b.dataset.f;b.textContent=k==="全部"?"全部":k+" "+c[k]});document.querySelector("#wishCount").textContent=c["想买"]}
function r(){const q=Q.value.trim().toLowerCase(),a=B.filter(b=>(f==="全部"||b.t===f)&&(!q||b.x.toLowerCase().includes(q)||b.c.toLowerCase().includes(q)));L.innerHTML=a.length?a.map(b=>'<article class="book"><h2'+(b.local?' class="hasdel"':'')+'>'+esc(b.x)+(b.local?'<button class="del" data-id="'+esc(b.id)+'" title="删除这条">×</button>':'')+'</h2><div class="meta"><span>'+esc(b.c)+'</span><span class="badge '+b.t+'">'+b.t+'</span></div></article>').join(""):'<p>没有找到符合条件的书</p>'}
function setTab(k){f=k;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.f===k))}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{setTab(b.dataset.f);r()});
Q.oninput=r;
L.addEventListener("click",e=>{const id=e.target.getAttribute("data-id");if(!id)return;notes=notes.filter(n=>n.id!==id);save();B=build();refresh();r()});
const WI=document.querySelector("#wishInput"),WT=document.querySelector("#wishType"),WA=document.querySelector("#wishAdd");
function add(){const v=WI.value.trim();if(!v)return;const t=WT.value;notes.push({x:v,t:t,id:"n"+Date.now()});save();WI.value="";B=build();setTab(t);refresh();r()}
WA.onclick=add;
WI.onkeydown=e=>{if(e.key==="Enter")add()};
document.querySelector("#wishCopy").onclick=()=>{const txt=B.filter(b=>b.t==="想买").map((b,i)=>(i+1)+". "+b.x).join("\n"),btn=document.querySelector("#wishCopy");const done=()=>{const o=btn.textContent;btn.textContent="已复制 ✓";setTimeout(()=>btn.textContent=o,1600)};const fb=()=>{const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done()}catch(e){}document.body.removeChild(ta)};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,fb)}else fb()};
refresh();r();
</script></body></html>
